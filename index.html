<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inconsolata:wght@200..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="socail-profile">
        <div class="profile-user" id="profile-user">
          <img src="./assets/images/avatar-jessica.jpeg" alt="profile" />
        </div>

        <div class="name-address">
          <h1 class="text">Jessica Randall</h1>
          <p class="text">London, United Kingdom</p>
        </div>

        <div class="job">
          <p class="text">"Front-end developer and avid reader."</p>
        </div>

        <div class="button-zone">
          <form action="https://github.com/username" target="_blank">
            <button type="submit">GitHub</button>
          </form>
          <form action="https://github.com/username" target="_blank">
            <button type="submit">Frontend Mentor</button>
          </form>
          <form action="https://github.com/username" target="_blank">
            <button type="submit">LinkedIn</button>
          </form>
          <form action="https://github.com/username" target="_blank">
            <button type="submit">Twitter</button>
          </form>
          <form action="https://github.com/username" target="_blank">
            <button type="submit">Instagram</button>
          </form>
        </div>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://www.frontendmentor.io/profile/MrPorkun">MrPorkun</a>.
    </footer>
  </body>
</html>
